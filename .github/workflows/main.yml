name: Python Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest flask pyyaml pytest-html
    - name: Start Mock Server in background
      run: |
        python mock_server/app.py &
        sleep 3
    - name: Run tests
      run: |
        pytest tests/ -s
